name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-build:
    name: 检查并构建
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: 构建项目
        run: npm run build
