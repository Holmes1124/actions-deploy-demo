name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建生产文件
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: 构建项目
        run: npm run build

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest

    # build 成功后才执行 deploy
    needs: build

    # 只允许 main 分支部署
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 执行部署
        id: deployment
        uses: actions/deploy-pages@v4
